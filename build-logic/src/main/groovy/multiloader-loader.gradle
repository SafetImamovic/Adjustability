plugins {
    id 'multiloader-common'
}

// The common project of the same Minecraft version, like :common:26.3.
def commonPath = ":common:${stonecutter.current.version}"

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
    // :graph sources are compiled into the loader jar, same as :common.
    graphJava {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    compileOnly(project(commonPath)) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    // Optional JEI integration in common (compat/jei); loaders compile common's sources too.
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    commonJava(project(path: commonPath, configuration: 'commonJava'))
    commonResources(project(path: commonPath, configuration: 'commonResources'))
    graphJava(project(path: ':graph', configuration: 'graphJava'))
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    dependsOn(configurations.graphJava)
    source(configurations.graphJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    dependsOn(configurations.graphJava)
    source(configurations.graphJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.graphJava)
    from(configurations.graphJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
