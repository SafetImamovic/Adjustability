# Everything that changes with the Minecraft version. Read into every :common, :fabric and :neoforge project of this
# version by build-logic (multiloader-common.gradle).
minecraft_version=1.21.1
# NeoForge (Maven range) and Fabric (fabric.mod.json) syntax
minecraft_version_range=[1.21.1, 1.21.2)
minecraft_version_range_fabric=1.21.1
java_version=21
## NeoForm = vanilla Minecraft for the 'common' project, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.116.17+1.21.1
# Forge Config API Port: NeoForge's config system on Fabric (and for common), see https://modrinth.com/mod/forge-config-api-port
forgeconfigapiport_version=21.1.6
# Mod Menu: dev runtime only, to open the config screen on Fabric
modmenu_version=11.0.5
# YACL: optional config screen, see https://modrinth.com/mod/yacl/versions
yacl_version=3.8.2+1.21.1
# JEI (optional integration, compile only)
jei_version=19.69.0.457

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.1.264

# What players need, which can be older than what the mod is built against (above). Tested 2026-10-23: NeoForge
# 21.1.1, Fabric API 0.102.0 and Forge Config API Port 21.1.0 compile and load the mod. Forge Config API Port 21.1.0
# needs Fabric Loader 0.16.0.
fabric_loader_requirement=>=0.16.0
fabric_api_requirement=>=0.102.0
forgeconfigapiport_requirement=>=21.1.0
yacl_requirement=>=3.8.2
yacl_version_range=[3.8.2,)
neoforge_version_range=[21.1.1,)
