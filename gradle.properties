# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.
# Per Minecraft version properties (minecraft_version, dependency versions, java_version) are in
# versions/<minecraft version>/gradle.properties.

# Project
version=0.4.0
group=io.github.safetimamovic.adjustability
# For :graph, which every version compiles from source, so it's the oldest version's Java; versioned projects use their
# version's java_version.
java_version=21

# Common
mod_name=Adjustability
mod_author=SafetImamovic
mod_id=adjustability
license=MIT
credits=
description=Hold mutually exclusive enchantments on one item and switch between them. Fortune or Silk Touch on one pickaxe, never both at once.
homepage=https://github.com/SafetImamovic/Adjustability
sources=https://github.com/SafetImamovic/Adjustability
issues=https://github.com/SafetImamovic/Adjustability/issues

# Fabric Loader works across Minecraft versions, see https://fabricmc.net/develop/ for new versions
fabric_loader_version=0.19.5

# NeoForge
neoforge_loader_version_range=[4,)

# Testing
junit_version=5.13.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
