plugins {
    id 'multiloader-loader'
}

// Minecraft is unobfuscated from 26.1 on. Older versions need Loom's remapping variant, Mojang's mappings, and mods
// in the mod* configurations so Loom remaps them.
def obfuscated = stonecutter.eval(stonecutter.current.version, '<26.1')
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
def mod = { String configuration -> obfuscated ? "mod${configuration.capitalize()}" : configuration }

// The client GameTests are written for the test framework of 26.3; older versions are tested by hand.
if (stonecutter.eval(stonecutter.current.version, '<26.3')) {
    sourceSets.main.java.exclude('io/github/safetimamovic/adjustability/gametest/**')
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    if (obfuscated) {
        mappings(loom.officialMojangMappings())
    }
    "${mod('implementation')}"("net.fabricmc:fabric-loader:${fabric_loader_version}")
    "${mod('implementation')}"("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    "${mod('implementation')}"("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}")
    "${mod('localRuntime')}"("maven.modrinth:modmenu:${modmenu_version}")
    // Optional config screen.
    "${mod('compileOnly')}"("maven.modrinth:yacl:${yacl_version}-fabric")
    "${mod('localRuntime')}"("maven.modrinth:yacl:${yacl_version}-fabric")
    if (obfuscated) {
        // Remapping drops YACL's list of bundled libraries, so the dev run needs them on its own.
        localRuntime('org.quiltmc.parsers:json:0.2.1')
        localRuntime('org.quiltmc.parsers:gson:0.2.1')
        localRuntime('com.twelvemonkeys.imageio:imageio-webp:3.12.0')
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'QuiltMC'
                url = 'https://maven.quiltmc.org/repository/release/'
            }
        }
        filter {
            includeGroup('org.quiltmc.parsers')
        }
    }
}

loom {
    def aw = rootProject.file("common/src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        // Drives a real client through the Adjust panel and exits: ./gradlew :fabric:26.3:runClientGametest
        clientGametest {
            client()
            setConfigName('Fabric Client Game Test')
            vmArg('-Dfabric.client.gametest')
            runDir('runs/clientgametest')
        }
        // Runs every GameTest headless and exits: ./gradlew :fabric:26.3:runGametest
        gametest {
            server()
            setConfigName('Fabric Game Test')
            vmArg('-Dfabric-api.gametest')
            runDir('runs/gametest')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// ./gradlew :fabric:26.3:runGametest -PwriteDocs rewrites docs/reference/ (the generated_docs GameTest)
tasks.matching { it.name == 'runGametest' }.configureEach {
    if (project.hasProperty('writeDocs')) {
        environment('ADJUSTABILITY_WRITE_DOCS', '1')
    }
}
