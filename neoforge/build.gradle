plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        // Second client for multiplayer tests; NeoForge dev clients are all called "Dev" otherwise.
        client2 {
            client()
            gameDirectory = this.mkdir(this.file('runs/client2'))
            programArguments.addAll '--username', 'Dev2'
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // DataGen can be run by - "./gradlew :neoforge:26.3:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        // Runs every GameTest headless and exits: ./gradlew :neoforge:26.3:runGameTestServer
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = this.mkdir(this.file('runs/gametest'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// For the run configs only, not published, as in NeoForge's MDK.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional config screen.
    compileOnly("maven.modrinth:yacl:${yacl_version}-neoforge")
    localRuntime("maven.modrinth:yacl:${yacl_version}-neoforge")

    // Compat testing only, never published: mods that add enchantments and change the anvil and enchanting table.
    //   ./gradlew :neoforge:26.1:runGameTestServer -Pcompat=enchants
    // The GameTests only exist from 26.1 (see ModRegistries), and Apotheosis has no 26.2 or 26.3 build yet.
    if (project.findProperty('compat') == 'enchants') {
        if (minecraft_version == '26.1.2') {
            localRuntime('maven.modrinth:apotheosis:26.1.2-9.1.0')
            localRuntime('maven.modrinth:apothic-enchanting:26.1.2-2.1.0')
            localRuntime('maven.modrinth:apothic-attributes:26.1.2-3.1.0')
            localRuntime('maven.modrinth:apothic-spawners:26.1.2-2.0.1')
            localRuntime('maven.modrinth:placebo:26.1.2-10.0.2')
            localRuntime('maven.modrinth:patchouli:26.1-94-beta')
        } else {
            logger.warn("-Pcompat=enchants has no NeoForge mods for Minecraft ${minecraft_version}")
        }
    }
    // Enchancement instead of Apotheosis (rival overhauls, so a run of their own):
    //   ./gradlew :neoforge:26.1:runGameTestServer -Pcompat=enchancement
    // It runs on Forgified Fabric API; its builds for NeoForge are 26.1 and 26.2 only. Modrinth version IDs, not numbers:
    // the Fabric and NeoForge builds share a version number, so the number alone resolves to the Fabric jar.
    if (project.findProperty('compat') == 'enchancement') {
        if (minecraft_version == '26.1.2') {
            localRuntime('maven.modrinth:enchancement:hKDMxxRR')
            localRuntime('maven.modrinth:strawberrylib:9cn8abyl')
            localRuntime('maven.modrinth:forgified-fabric-api:bqnuKGQ4')
            localRuntime('maven.modrinth:launchpad:isqNNLhL')
            // Its defaults disallow 36 vanilla enchantments and limit items to one enchantment, so the vanilla-based
            // tests would test nothing (as on Fabric). Dev run directory only; keeps its own enchantments.
            def writeEnchancementConfig = tasks.register('writeEnchancementCompatConfig') {
                def target = file('runs/gametest/config/enchancement.json')
                doLast {
                    target.parentFile.mkdirs()
                    target.text = '''{
  "disallowedEnchantments": [],
  "invertedList": false,
  "overhaulEnchanting": "DISABLED",
  "enchantedBookGrinding": false,
  "levellessEnchantments": false,
  "enchantmentLimit": 0,
  "disableDurability": "NONE",
  "enhanceMobs": false,
  "rebalanceConsumables": false,
  "rebalanceEffects": false,
  "rebalanceEnchantments": false,
  "rebalanceEquipment": false,
  "rebalanceProjectiles": false,
  "toggleablePassives": false,
  "fixVanillaBugs": false,
  "enchantmentDescriptions": false,
  "coloredEnchantmentNames": false
}
'''
                }
            }
            tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn(writeEnchancementConfig) }
        } else {
            logger.warn("-Pcompat=enchancement has no NeoForge mods for Minecraft ${minecraft_version}")
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
